<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg">
<title>Je m'ennuie !</title><link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
<header><div><div class="brand">Je m’ennuie !</div><div class="subtitle">Une idée quand tu ne sais pas quoi faire ✨</div></div><button class="iconbtn" id="randomTop">🎲</button></header>
<main id="home">
<section class="hero"><div><span class="pill">✨ Nouvelle idée</span><h1>Tu t’ennuies ?<br><b>On a une idée.</b></h1><p>Lance la roulette ou choisis directement une activité.</p><button class="primary" id="spinHero">🎰 Faire tourner la roulette</button></div></section>
<h2>Choisir une activité</h2>
<div class="filters"><button class="filter active" data-filter="Toutes">Toutes</button><button class="filter" data-filter="Cuisine">🍳 Cuisine</button><button class="filter" data-filter="Extérieur">🌳 Extérieur</button><button class="filter" data-filter="Sport">🏃 Sport</button><button class="filter" data-filter="À la maison">🏠 Maison</button><button class="filter" data-filter="Créativité">🎨 Créatif</button></div>
<div id="cards" class="grid"></div>
</main>
<main id="roulette" class="screen hidden"><button class="back">← Retour</button><div class="rouletteHead"><h2>La roulette</h2><p>Ça défile… et ça s’arrête sur ton activité 🎯</p></div><div class="rouletteWindow"><div id="rouletteTrack"></div></div><button class="primary big" id="spin">🎰 TOURNER</button><div id="rouletteHint">Prêt ?</div></main>
<main id="detail" class="screen hidden"><button class="back">← Retour</button><div id="detailContent"></div></main>
<nav><button data-nav="home" class="navactive">⌂<span>Accueil</span></button><button data-nav="roulette">🎰<span>Roulette</span></button><button data-nav="favorites">♥<span>Favoris</span></button></nav>
</div>
<script src="app.js"></script></body></html>
